[pytest]
# 为什么要有这个文件：直接跑 `pytest`（不带路径）时，pytest 会从当前目录递归收集，
# 于是会把 teammate_src/（队友源码的只读参考副本）里的脚本也当成测试 import ——
# 其中 tools/test_key.py 在模块层就 sys.exit(1)，导致整个 pytest 报
# INTERNALERROR 而不是"测试失败"，看起来像我们的代码坏了。
# 这里把收集范围钉死在 tests/，顺便忽略掉几个不该收集的历史目录。
testpaths = tests
norecursedirs = teammate_src teammate_src/* demo_app .git data docs samples_demo static tools _internal
